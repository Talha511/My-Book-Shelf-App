name: book_library_pro
description: "A premium Book Library application built with MVVM and Clean Architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.5+1
  flutter_riverpod: ^2.5.1

  # UI & Fonts
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8
  animations: ^2.1.1
  lottie: ^3.3.1
  flutter_rating_bar: ^4.0.1
  smooth_page_indicator: ^1.2.0+3
  intl_phone_field: ^3.2.0
  quickalert: ^1.1.0
  flutter_localizations:
    sdk: flutter

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.8
  uuid: ^4.5.1
  logger: ^2.5.0
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  geolocator: ^13.0.2

  # Local Storage
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Network
  http: ^1.4.0
  dio: ^5.8.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#384325"
  adaptive_icon_foreground: "assets/images/app_icon.png"



flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/mock/